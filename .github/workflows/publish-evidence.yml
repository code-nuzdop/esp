name: Publish browsable evidence tree
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-evidence.yml'
      - 'scripts/publish_evidence_tree.py'
      - 'SjTNlCHNfW_MASTER_evidence_package.zip'
      - 'SjTNlCHNfW.exe'
      - 'README_START_HERE.md'
      - 'AUDIT.json'
      - 'MANIFEST_SHA256.txt'
      - 'historical/**'
      - 'scripts/**'
      - 'evidence/**'
      - 'report/**'
      - 'README.md'
      - '*.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack static evidence (no EXE execution)
        run: python3 scripts/publish_evidence_tree.py
      - name: Check repository and ZIP SHA-256 coverage
        run: python3 scripts/verify_integrity.py
      - name: Commit readable evidence tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified browsable loader/protector evidence tree"
            git push origin HEAD:main
          fi
